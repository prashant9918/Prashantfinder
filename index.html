<!DOCTYPE html><html><head><title>PrashantFinder</title>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrashantFinder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f2f2f2;
            padding: 50px 20px;
        }

        h1 {
            color: #222;
        }

        input {
            width: 80%;
            max-width: 400px;
            padding: 14px;
            font-size: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 14px 25px;
            margin-top: 15px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>🔎 PrashantFinder</h1>
    <p>Search something below</p>

    <input type="text" id="search" placeholder="Type here...">
    <br>
    <button onclick="search()">Search</button>

    <div id="result"></div>

    <script>
        function search() {
            let text = document.getElementById("search").value;

            if (text.trim() === "") {
                document.getElementById("result").innerHTML =
                    "Please enter something!";
            } else {
                document.getElementById("result").innerHTML =
                    "You searched for: <b>" + text + "</b>";
            }
        }
    </script>

</body>
</html>
